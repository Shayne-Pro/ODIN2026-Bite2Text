name: Source tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  final-decision-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependency
        run: python -m pip install --requirement requirements-test.txt
      - name: Run final v9 source tests
        working-directory: task2_bite2text/hybrid_submission_v9_final
        run: python -m unittest -v test_report_sanitizer.py test_risk_rerank.py
